# SPDX-License-Identifier: Apache-2.0
[package]
name = "modem-proto"
description = "QRTR, QMI and the modem's apps-side services (rmtfs, service locator, TFTP) for NeoSymbian"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
modem-ipc = { path = "../modem-ipc" }
# the Wi-Fi firmware's QMI client lives in NeoSymbian/wifi (owner, 2026-11-12); MODEMD drives it because it owns
# the modem's QRTR link. shortcut: a path to a sibling checkout until the wifi repo is on GitHub (then a git rev).
wlfw = { path = "../../../wifi/crates/wlfw" }
