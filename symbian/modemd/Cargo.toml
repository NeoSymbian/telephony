# SPDX-License-Identifier: Apache-2.0
[package]
name = "modemd"
description = "MODEMD.EXE: the apps side of the Pixel's modem (QRTR router, rmtfs, service locator, TFTP)"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["staticlib"]
test = false

[features]
# Startup-only diagnostic build: never boot MSS or request radio online; ADSP/loopback remain available.
radio-disabled = []
# Diagnostic build: log every QRTR packet with its first 40 payload bytes (docs wifi.md W0).
qrtr-trace = []

[dependencies]
e32.workspace = true
modem-proto.workspace = true
ext4ro.workspace = true
